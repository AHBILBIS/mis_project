<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MIS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Welcome back, {{ user.username }}!</h2>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <h5 class="fw-bold"><i class="bi bi-person me-2"></i>Account Details</h5>
                    <p class="mb-1"><strong>Email:</strong> {{ user.email }}</p>
                    <p class="mb-1"><strong>Role:</strong> <span class="badge bg-primary">{{ user.role|default:"STAFF" }}</span></p>
                    <p class="mb-0"><strong>Joined:</strong> {{ user.date_joined|date:"M d, Y" }}</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <h5 class="fw-bold"><i class="bi bi-grid me-2"></i>Quick Actions</h5>
                    <div class="d-grid gap-2">
                        <a href="{% url 'store_home' %}" class="btn btn-outline-success text-start p-3 fw-bold"><i class="bi bi-shop me-2"></i>Online Shopping Store</a>
                        <a href="{% url 'customer_dashboard' %}" class="btn btn-outline-dark text-start p-3 fw-bold"><i class="bi bi-bag-check me-2"></i>Customer Orders Dashboard</a>
                        <a href="{% url 'staff_list' %}" class="btn btn-outline-primary text-start p-3"><i class="bi bi-people me-2"></i>Staff Directory</a>
                        <a href="{% url 'inventory_list' %}" class="btn btn-outline-primary text-start p-3"><i class="bi bi-boxes me-2"></i>Inventory & Excel Export</a>
                        <a href="{% url 'create_report' %}" class="btn btn-outline-primary text-start p-3"><i class="bi bi-file-earmark-word me-2"></i>Write Word Report</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
