<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - AHBILBIS ENTERPRISE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        <h3 class="fw-bold mb-4"><i class="bi bi-box-seam text-primary me-2"></i>{{ title }}</h3>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Item Name</label>
                                {{ form.item_name }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">SKU Code</label>
                                {{ form.sku }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Quantity in Stock</label>
                                {{ form.quantity }}
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Unit Price ($)</label>
                                {{ form.unit_price }}
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url "inventory_list" %}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Item</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
