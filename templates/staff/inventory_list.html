<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory - AHBILBIS ENTERPRISE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0"><i class="bi bi-boxes me-2"></i>Inventory Management</h2>
                <p class="text-muted m-0">Track and export stock items to Excel.</p>
            </div>
            <div>
                <a href="{% url "export_inventory_excel" %}" class="btn btn-success"><i class="bi bi-file-earmark-excel me-1"></i> Export Excel Sheet (.xlsx)</a>
                <a href="{% url "dashboard" %}" class="btn btn-outline-secondary ms-2">Dashboard</a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Item Name</th>
                            <th>SKU</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td class="ps-4 fw-semibold">{{ item.item_name }}</td>
                            <td><span class="badge bg-secondary">{{ item.sku }}</span></td>
                            <td>{{ item.quantity }}</td>
                            <td>${{ item.unit_price }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">No inventory records available.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
