<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - MIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        <h3 class="fw-bold mb-4">{{ title }}</h3>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department Name</label>
                                {{ form.name }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department Code</label>
                                {{ form.code }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Description</label>
                                {{ form.description }}
                            </div>

                            <div class="mt-4 d-flex justify-content-between">
                                <a href="{% url "department_list" %}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">Save Department</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
